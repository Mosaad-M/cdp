[package]
name = "cdp"
version = "1.3.0"
description = "Chrome DevTools Protocol (CDP) client for Mojo"
license = "MIT"
platforms = ["linux-64", "osx-arm64"]

[mojo]
requires = ">=1.2.0"

[dependencies]
websocket = { git = "Mosaad-M/websocket", version = ">=1.4.0" }
json = { git = "Mosaad-M/json", version = ">=3.1.0" }
tcp = { git = "Mosaad-M/tcp", version = ">=2.1.0" }
